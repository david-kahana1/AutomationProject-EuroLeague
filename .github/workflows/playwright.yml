name: Playwright Tests - Euroleague Automation

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        cd page_object_euroleague
        pip install -r requirements.txt
        playwright install

    - name: Run tests
      run: |
        cd page_object_euroleague
        CI=true pytest --alluredir=allure-results

    - name: Install Allure CLI
      if: always()
      run: |
        npm install -g allure-commandline

    - name: Download previous Allure history
      if: always()
      continue-on-error: true
      run: |
        cd page_object_euroleague
        curl -O -L "https://david-kahana1.github.io/AutomationProject-EuroleagueAutomation/history/history.json"
        mkdir -p allure-results/history
        mv history.json allure-results/history/

    - name: Generate Allure Report
      if: always()
      run: |
        cd page_object_euroleague
        allure generate allure-results --clean -o allure-report

    - name: Upload Allure Report Artifact
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: allure-report
        path: page_object_euroleague/allure-report

  deploy:
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
    - name: Download Allure Report Artifact
      uses: actions/download-artifact@v5
      with:
        name: allure-report
        path: ./allure-report

    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./allure-report

    - name: Deploy
      uses: actions/deploy-pages@v4
